<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">STELLA BALL</title>
  <desc id="desc">Stella Ball pixel-inspired wordmark in starlight gold and moonlight blue.</desc>
  <defs>
    <linearGradient id="stella" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#fff6cf" offset="0"/>
      <stop stop-color="#f1c96d" offset="1"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" x2="1">
      <stop stop-color="#90a2ff" stop-opacity="0" offset="0"/>
      <stop stop-color="#dfe7ff" stop-opacity=".82" offset=".45"/>
      <stop stop-color="#f3cc78" stop-opacity="0" offset="1"/>
