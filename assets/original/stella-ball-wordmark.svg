  <text x="356" y="96" fill="url(#stella)" stroke="#fff7d5" stroke-opacity=".32" stroke-width="1" paint-order="stroke" font-family="Galmuri11,monospace" font-size="78" font-weight="900" letter-spacing="-5" text-anchor="middle">STELLA BALL</text>
  <path fill="#b9c8ff" d="M166 123h388v5H166z"/>
