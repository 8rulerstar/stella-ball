<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Breakers</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;background:#120d25;color:#f6edff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#342058,#120d25 58%)}main{width:min(980px,calc(100% - 22px));padding:24px 0}.tag{font:700 11px ui-monospace,monospace;letter-spacing:.15em;color:#d6bdff}header{display:flex;justify-content:space-between;align-items:end;margin:0 4px 12px}h1{margin:3px 0;font-size:30px;letter-spacing:-.06em}header p{margin:0;color:#c5b6d8;font-size:13px}.stage{position:relative;overflow:hidden;border:1px solid #7251a8;border-radius:14px;background:#17112c;box-shadow:0 24px 80px #0009}canvas{display:block;width:100%;height:auto;touch-action:none;image-rendering:pixelated}.hud{position:absolute;inset:12px 15px auto;display:grid;grid-template-columns:1fr minmax(260px,1.6fr) 1fr;gap:8px;align-items:start;pointer-events:none;font:700 11px ui-monospace,monospace}.hud-card,.boss-panel{border:1px solid #5b427f;background:#130d26dc;box-shadow:0 3px 0 #08051288;padding:9px 10px}.hud-card{min-height:57px}.hud-label{display:flex;justify-content:space-between;color:#bba9d4}.hud-label b{color:#fff3bf}.shot-dots{letter-spacing:3px;font-size:15px;color:#73628c;margin-top:4px}.shot-dots .on{color:#f9df7c;text-shadow:0 0 9px #f0b94a}.status-line{display:flex;justify-content:space-between;margin-top:5px;color:#e7d9f8}.status-line b{color:#fff0bd}.boss-panel{min-height:63px;text-align:center}.phase{color:#d6bdff;margin-bottom:4px}.boss-name{display:flex;justify-content:space-between;color:#f8eaff;margin-bottom:5px}.meter{height:8px;border:1px solid #120b23;background:#26193f;overflow:hidden}.meter i{display:block;height:100%;width:100%;transform-origin:left;transition:transform .18s}.meter.shield i{background:#83e5ff;box-shadow:0 0 10px #59cce9}.meter.hp{margin-top:3px}.meter.hp i{background:#ec718b;box-shadow:0 0 10px #dc5277}.tip{position:absolute;bottom:14px;left:16px;color:#d9cdea;font-size:12px;pointer-events:none}.tip b{color:#fff7d4}.toast{position:absolute;right:15px;top:83px;min-width:180px;padding:9px 11px;border:1px solid #d7b55c;background:#251a3ee8;color:#fff5c9;font:700 11px ui-monospace,monospace;opacity:0;transform:translateX(16px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(0)}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#0d0820e8;padding:30px}.overlay.hide{display:none}.overlay h2{margin:8px;font-size:34px;letter-spacing:-.06em}.overlay p{max-width:590px;margin:6px auto;color:#d5c7e7;font-size:14px;line-height:1.7}.overlay button,header button{border:1px solid #c9a8ff;border-radius:7px;background:#633da4;color:white;padding:10px 15px;font-weight:700;cursor:pointer}.overlay button:hover,header button:hover{background:#8158c4}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:660px;margin:15px auto}.choice-card{position:relative;min-height:126px;padding:12px;text-align:left;background:#211a35;border:1px solid #665081;color:#eee4fa}.choice-card:hover{transform:translateY(-3px);border-color:#fff2bc;background:#30234b}.choice-card .accent{display:block;width:100%;height:5px;margin-bottom:10px;background:var(--accent)}.choice-card strong{display:block;color:#fff4d1;font-size:14px}.choice-card small{display:block;margin-top:7px;color:#d3c4e6;font-size:11px;line-height:1.5}.choice-card em{display:block;margin-top:10px;color:var(--accent);font-style:normal;font:700 10px ui-monospace,monospace}.hero-card{min-height:104px;display:grid;grid-template-columns:56px 1fr;gap:7px;align-items:center}.hero-card .portrait{width:56px;height:56px;display:block;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #120d25)}.runes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.runes div{padding:10px;border:1px solid #534072;border-radius:8px;background:#1b1430;color:#cfc2df;font-size:11px;line-height:1.5}.runes b{color:#fff0c6}@media(max-width:680px){main{padding:9px 0}header{align-items:start}header p{display:none}.hud{grid-template-columns:1fr 1fr;inset:8px}.boss-panel{grid-column:span 2;order:-1}.toast{top:96px;right:8px}.runes{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.overlay{overflow:auto;place-content:start center;padding:46px 18px 22px}.overlay h2{font-size:27px}.hero-card{grid-template-columns:42px 1fr;font-size:10px}.hero-card .portrait{width:42px;height:42px}.tip{font-size:10px;bottom:8px;left:10px}.hud-card{padding:6px 8px;min-height:50px}}
</style>
<body>
<main>
  <header>
    <div><div class="tag">반사 액션 × 파티 조합 / 수직 슬라이스</div><h1>PRISM BREAKERS</h1><p>한 발의 유물탄으로 동료 룬을 통과해 보스의 약점을 깨뜨린다.</p></div>
    <button onclick="showRoster()">파티 편성</button>
  </header>
  <section class="stage">
    <canvas id="game" width="920" height="540"></canvas>
    <div class="hud">
      <section class="hud-card"><div class="hud-label"><span>유물탄</span><b id="shotsText">3 / 3</b></div><div class="shot-dots" id="shotDots">● ● ●</div></section>
      <section class="boss-panel"><div class="phase" id="phaseText">1단계 · 방벽 해제</div><div class="boss-name"><span>공허의 왕</span><b id="hpText">코어 100</b></div><div class="meter shield"><i id="shieldFill"></i></div><div class="meter hp"><i id="hpFill"></i></div></section>
      <section class="hud-card"><div class="hud-label"><span>약점 위력</span><b id="powerText">14</b></div><div class="status-line"><span>룬 연계</span><b id="chainText">—</b></div></section>
    </div>
    <div class="toast" id="toast"></div>
    <div class="tip" id="tip">유물탄에서 <b>당겨서 놓기</b> · 이번 단계의 방벽을 3발 안에 깨세요.</div>
    <div id="overlay" class="overlay"></div>
  </section>
  <section class="runes" id="runeSummary"></section>
</main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;
x.imageSmoothingEnabled=false;
const U={shotsText:document.querySelector('#shotsText'),shotDots:document.querySelector('#shotDots'),phase:document.querySelector('#phaseText'),hp:document.querySelector('#hpText'),shield:document.querySelector('#shieldFill'),hpFill:document.querySelector('#hpFill'),power:document.querySelector('#powerText'),chain:document.querySelector('#chainText'),tip:document.querySelector('#tip'),over:document.querySelector('#overlay'),toast:document.querySelector('#toast'),summary:document.querySelector('#runeSummary')};
const RULES={baseDamage:14,chainStep:.34,shots:3,shield:56,coreHp:100};
const heroes={
  gaon:{n:'성벽 기사 가온',s:'가온',e:'반사',d:'룬 충돌 뒤 강한 반사력을 얻습니다.',fx:'guard',col:'#f2c56b',sprite:'../assets/characters/gaon-warrior-idle.png',fw:192,fh:192,frames:8,scale:.38},
  biyeon:{n:'추적 사수 비연',s:'비연',e:'표식',d:'다음 약점 적중 피해를 크게 증폭합니다.',fx:'edge',col:'#ef718d',sprite:'../assets/characters/biyeon-archer-idle.png',fw:192,fh:192,frames:6,scale:.38},
  lumi:{n:'항로 마녀 루미',s:'루미',e:'유도',d:'짧은 시간 유물탄을 약점 쪽으로 휘게 합니다.',fx:'pulse',col:'#70dce1',sprite:'../assets/characters/lumi-shaman-idle.png',fw:192,fh:192,frames:8,scale:.38},
  haru:{n:'연쇄 전령 하루',s:'하루',e:'릴레이',d:'다음 파티 룬으로 공을 전달합니다.',fx:'relay',col:'#9ee477',sprite:'../assets/characters/haru-lancer-idle.png',fw:320,fh:320,frames:12,scale:.25},
  sera:{n:'궤도 사제 세라',s:'세라',e:'원심',d:'공이 멈추면 줄로 연결해 한 번 더 회전 발사합니다.',fx:'orbit',col:'#bca7ff',sprite:'../assets/characters/sera-monk-idle.png',fw:192,fh:192,frames:6,scale:.38},
  taeo:{n:'폭파 광부 태오',s:'태오',e:'충격',d:'다음 벽 충돌에서 폭발적으로 가속합니다.',fx:'mine',col:'#ffac67',sprite:'../assets/characters/taeo-miner-idle.png',fw:192,fh:192,frames:8,scale:.38}
};
const bossArt={sprite:'../assets/bosses/void-troll-idle.png',fw:384,fh:384,frames:12,scale:.48};
const staticArt={orb:'../assets/original/prism-orb.svg',weak:'../assets/original/weakpoint.svg',rock1:'../assets/terrain/rock-01.png',rock4:'../assets/terrain/rock-04.png'};
const textures={};for(const spec of [...Object.values(heroes),bossArt]){const im=new Image();im.src=spec.sprite;textures[spec.sprite]=im}for(const path of Object.values(staticArt)){const im=new Image();im.src=path;textures[path]=im}
const upgrades=[
  {id:'lens',tag:'약점',title:'균열 렌즈',text:'약점 피해가 +7 증가합니다.',accent:'#ffd36d',apply:b=>b.weakFlat+=7},
  {id:'chorus',tag:'연계',title:'공명 코일',text:'룬 하나당 연계 배율이 +16% 증가합니다.',accent:'#83e8f5',apply:b=>b.chainStep+=.16},
  {id:'reserve',tag:'발사',title:'예비 탄창',text:'이후 단계의 발사 횟수가 +1 증가합니다.',accent:'#f6a6ce',apply:b=>b.extraShots+=1},
  {id:'kinetic',tag:'반사',title:'운동량 프레임',text:'벽 반사마다 피해가 +8% 증가합니다.',accent:'#9ee477',apply:b=>b.bounceStep+=.08},
  {id:'mark',tag:'표식',title:'사냥꾼의 눈',text:'표식 룬의 약점 피해 배율이 1.38 → 1.70이 됩니다.',accent:'#ef718d',apply:b=>b.markMultiplier=1.70},
  {id:'battery',tag:'방벽',title:'위상 배터리',text:'방벽 단계에서 피해가 +9 증가합니다.',accent:'#bca7ff',apply:b=>b.shieldFlat+=9}
];
let selected=['gaon','biyeon','lumi'];
let build,ball,boss,gates=[],battle,drag=null,run=false,chain=[],popups=[],last=0,toastTimer=0,msg='파티를 편성하세요.';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resetBuild(){build={weakFlat:0,chainStep:0,extraShots:0,bounceStep:0,markMultiplier:1.38,shieldFlat:0,names:[]}}
function setupBattle(){battle={phase:1,shotMax:RULES.shots+build.extraShots,shots:RULES.shots+build.extraShots};boss={x:667,y:220,hp:RULES.coreHp,maxHp:RULES.coreHp,shield:RULES.shield+build.shieldFlat,maxShield:RULES.shield+build.shieldFlat,a:0,hitCooldown:0};startShot();run=true;U.over.classList.add('hide');msg='방벽이 있는 동안에는 코어가 보호됩니다. 3발 안에 방벽을 깨세요.';toast('1단계 · 방벽 해제');sync()}
function startShot(){ball={x:150,y:422,vx:0,vy:0,r:13,moving:false,trail:[],power:0,bounces:0};const spots=[[326,168],[470,363],[554,118]];gates=selected.map((id,i)=>({id,...heroes[id],x:spots[i][0],y:spots[i][1],r:31,on:0}));chain=[];drag=null}
function refillForCore(){battle.phase=2;battle.shots=battle.shotMax;startShot();run=true;U.over.classList.add('hide');msg='방벽이 깨졌습니다. 남은 발사로 공허의 코어를 파괴하세요.';toast('2단계 · 코어 노출');sync()}
function showRoster(){run=false;U.over.innerHTML='<div class="tag">파티 편성</div><h2>출전할 세 명을 고르세요.</h2><p>캐릭터는 공격력 수치가 아니라 유물탄의 물리 법칙을 바꿉니다.</p><div id="roster" class="choice-grid" style="max-width:660px"></div><button id="startTeam">전투 각인 선택</button>';const box=document.querySelector('#roster');Object.entries(heroes).forEach(([id,h])=>{const on=selected.includes(id),b=document.createElement('button');b.className='hero-card';b.innerHTML='<span class="portrait"></span><span><b>'+h.n+'</b><br>'+h.e+' · '+h.d+'</span>';b.style.cssText='text-align:left;margin:0;padding:9px;background:'+(on?h.col:'#211a35')+';color:'+(on?'#24172c':'#eadfff')+';border-color:'+h.col;const p=b.querySelector('.portrait');p.style.backgroundImage='url("'+h.sprite+'")';p.style.backgroundSize=(h.frames*56)+'px 56px';b.onclick=()=>{if(selected.includes(id))selected=selected.filter(v=>v!==id);else if(selected.length<3)selected.push(id);showRoster()};box.append(b)});document.querySelector('#startTeam').onclick=()=>{if(selected.length!==3)return alert('세 명을 선택해주세요.');resetBuild();showDraft('전투 각인','첫 방벽을 깰 하나의 유물 강화를 고르세요.',setupBattle)};U.over.classList.remove('hide')}
function pickUpgrades(){return [...upgrades].sort(()=>Math.random()-.5).slice(0,3)}
function showDraft(title,sub,next){run=false;const picks=pickUpgrades();U.over.innerHTML='<div class="tag">유물 강화</div><h2>'+title+'</h2><p>'+sub+'</p><div id="draft" class="choice-grid"></div>';const box=document.querySelector('#draft');for(const up of picks){const b=document.createElement('button');b.className='choice-card';b.style.setProperty('--accent',up.accent);b.innerHTML='<span class="accent"></span><strong>'+up.title+'</strong><small>'+up.text+'</small><em>'+up.tag+' 강화</em>';b.onclick=()=>{up.apply(build);build.names.push(up.title);toast(up.title+' 획득');next()};box.append(b)}U.over.classList.remove('hide')}
function endShot(){ball.moving=false;ball.vx=ball.vy=0;ball.trail=[];if(battle.shots<=0){run=false;if(boss.shield>0)return fail('방벽을 넘지 못했습니다. 다른 각도와 파티 조합을 시도하세요.');if(boss.hp>0)return fail('코어가 다시 닫혔습니다. 강화 조합을 바꿔 보세요.')}else{startShot();msg='다음 발사를 설계하세요. 룬 연계가 피해를 키웁니다.';sync()}}
function fail(text){U.over.innerHTML='<div class="tag">전투 종료</div><h2>공허의 왕이 버텼습니다.</h2><p>'+text+'</p><button onclick="showRoster()">파티 다시 편성</button>';U.over.classList.remove('hide')}
function win(){run=false;U.over.innerHTML='<div class="tag">코어 파괴</div><h2>공허의 왕을 무너뜨렸습니다.</h2><p>선택한 강화: '+(build.names.join(' · ')||'없음')+'<br>다른 파티 조합으로 더 짧은 발사를 노려보세요.</p><button onclick="showRoster()">다른 파티로 전투</button>';U.over.classList.remove('hide')}
function toast(text){U.toast.textContent=text;U.toast.classList.add('show');toastTimer=2.2}
function sync(){const shieldActive=boss&&boss.shield>0;U.shotsText.textContent=battle?battle.shots+' / '+battle.shotMax:'—';U.shotDots.innerHTML=battle?Array.from({length:battle.shotMax},(_,i)=>'<span class="'+(i<battle.shots?'on':'')+'">●</span>').join(' '):'—';U.phase.textContent=!battle?'전투 준비':battle.phase===1?'1단계 · 방벽 해제':'2단계 · 코어 노출';U.hp.textContent=boss?'코어 '+Math.ceil(boss.hp):'코어 —';U.shield.style.transform='scaleX('+(boss?boss.shield/boss.maxShield:0)+')';U.hpFill.style.transform='scaleX('+(boss?boss.hp/boss.maxHp:0)+')';U.shield.parentElement.style.opacity=shieldActive?'1':'.22';U.power.textContent=RULES.baseDamage+build.weakFlat;U.chain.textContent=chain.length?chain.join(' → '):'—';U.tip.innerHTML=msg;U.summary.innerHTML=selected.map(id=>{const h=heroes[id];return '<div><b>'+h.n+' · '+h.e+'</b><br>'+h.d+'</div>'}).join('')}
function pointer(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{if(!run||ball.moving)return;const p=pointer(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<58){drag=p;c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(drag)drag=pointer(e)});
c.addEventListener('pointerup',e=>{if(!drag||ball.moving)return;const p=pointer(e),dx=ball.x-p.x,dy=ball.y-p.y,len=Math.hypot(dx,dy);drag=null;if(len<10)return;const v=Math.min(700,len*4.3);ball.vx=dx/len*v;ball.vy=dy/len*v;ball.moving=true;battle.shots--;chain=[];msg='룬을 통과시켜 약점 위력을 쌓으세요.';sync()});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')showRoster()});
function hitGate(g){if(g.on>.25)return;g.on=1;chain.push(g.s);if(g.fx==='guard'){ball.power=Math.max(ball.power,.75);msg='가온 · 다음 반사의 위력이 유지됩니다.'}if(g.fx==='edge'){ball.mark=true;msg='비연 · 다음 약점 명중에 표식이 적용됩니다.'}if(g.fx==='pulse'){ball.power+=.35;ball.pulse=2.2;msg='루미 · 약점 쪽으로 궤적이 휘어집니다.'}if(g.fx==='relay'){const i=gates.indexOf(g),target=gates[(i+1)%gates.length];if(target!==g&&target.on<=.25){ball.relay={from:{x:g.x,y:g.y},target,t:0};ball.vx=ball.vy=0;msg='하루 · 다음 파티 룬으로 유물탄을 전달합니다.';toast('릴레이 연결')}else{ball.vx*=1.18;ball.vy*=1.18;msg='하루 · 다음 룬이 닫혀 가속으로 전환합니다.'}}if(g.fx==='orbit'){ball.orbitGate=g;msg='세라 · 공이 멈추면 원심 룬이 한 번 더 궤도를 엽니다.'}if(g.fx==='mine'){ball.mine=true;msg='태오 · 다음 벽 반사에 충격이 쌓입니다.'}sync()}
function updateRelay(d){const r=ball.relay;if(!r)return;r.t+=d/.28;const t=Math.min(1,r.t),ease=t*t*(3-2*t);ball.x=r.from.x+(r.target.x-r.from.x)*ease;ball.y=r.from.y+(r.target.y-r.from.y)*ease;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>20)ball.trail.shift();if(t>=1){const a=Math.atan2(r.target.y-r.from.y,r.target.x-r.from.x);ball.x=r.target.x+Math.cos(a)*(r.target.r+ball.r+2);ball.y=r.target.y+Math.sin(a)*(r.target.r+ball.r+2);ball.vx=Math.cos(a)*620;ball.vy=Math.sin(a)*620;ball.relay=null;hitGate(r.target)}}
function beginOrbit(anchor){const dx=ball.x-anchor.x,dy=ball.y-anchor.y,r=Math.max(72,Math.hypot(dx,dy));ball.orbit={anchor,angle:Math.atan2(dy,dx),radius:r,t:0};ball.orbitUsed=true;ball.moving=true;ball.trail=[];msg='세라 · 원심 룬이 공을 감아 한 번 더 발사합니다.';toast('원심 재발사');sync()}
function updateOrbit(d){const o=ball.orbit;if(!o)return;o.t+=d;o.angle+=d*(7.4+Math.min(3,o.radius/65));o.radius+=(68-o.radius)*Math.min(1,d*5.5);ball.x=o.anchor.x+Math.cos(o.angle)*o.radius;ball.y=o.anchor.y+Math.sin(o.angle)*o.radius;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>20)ball.trail.shift();if(o.t>=.85){const speed=610+Math.min(150,o.radius*.35);ball.vx=-Math.sin(o.angle)*speed;ball.vy=Math.cos(o.angle)*speed;ball.orbit=null;msg='세라 · 축적된 원심력이 궤적을 밀어냅니다.';sync()}}
function addPopup(px,py,text,col,big=false){popups.push({x:px,y:py,text,col,t:0,big});if(popups.length>12)popups.shift()}
function damage(){let amount=RULES.baseDamage+build.weakFlat;amount*=1+Math.max(0,chain.length-1)*(RULES.chainStep+build.chainStep);amount*=1+ball.power*.18;if(ball.mark)amount*=build.markMultiplier;amount*=1+Math.min(.48,ball.bounces*build.bounceStep);const crit=Math.random()<.1+Math.min(.18,chain.length*.04);if(crit)amount*=1.6;amount=Math.round(amount);if(boss.shield>0){boss.shield=Math.max(0,boss.shield-amount);addPopup(boss.x,boss.y-72,'방벽 -'+amount,'#8feeff',crit);toast(crit?'정밀 반사!':'방벽 '+amount+' 피해');if(boss.shield<=0){run=false;toast('방벽 해제! 강화 선택');setTimeout(()=>showDraft('코어 각인','코어가 노출되었습니다. 마지막 강화를 고르세요.',refillForCore),260)}}else{boss.hp=Math.max(0,boss.hp-amount);addPopup(boss.x,boss.y-72,(crit?'치명 ':'')+amount,'#ffe59a',crit);toast(crit?'치명 약점 명중!':'약점 '+amount+' 피해');if(boss.hp<=0)setTimeout(win,180)}ball.vx*=-.88;ball.vy*=-.88;ball.power=0;ball.mark=false;ball.pulse=0;chain=[];sync()}
function update(d){if(toastTimer>0){toastTimer-=d;if(toastTimer<=0)U.toast.classList.remove('show')}for(const p of popups)p.t+=d;popups=popups.filter(p=>p.t<.9);if(!run)return;boss.a+=d*(battle.phase===1?.46:.72);boss.hitCooldown=Math.max(0,boss.hitCooldown-d);for(const g of gates)g.on=Math.max(0,g.on-d);if(!ball.moving)return;if(ball.relay){updateRelay(d);return}if(ball.orbit){updateOrbit(d);return}if(ball.pulse>0){ball.pulse-=d;const wx=boss.x+Math.cos(boss.a)*84,wy=boss.y+Math.sin(boss.a)*84,dx=wx-ball.x,dy=wy-ball.y,l=Math.hypot(dx,dy)||1;ball.vx+=dx/l*190*d}ball.x+=ball.vx*d;ball.y+=ball.vy*d;ball.vx*=Math.pow(.993,d*60);ball.vy*=Math.pow(.993,d*60);ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>20)ball.trail.shift();
const wall=()=>{ball.bounces++;if(ball.mine){ball.vx*=1.42;ball.vy*=1.42;ball.mine=false;msg='태오의 충격 룬이 벽 반사에 폭발했습니다.';toast('충격 반사!')}};if(ball.x<ball.r||ball.x>W-ball.r){ball.x=clamp(ball.x,ball.r,W-ball.r);ball.vx*=-1.02+Math.min(.12,ball.power*.03);wall()}if(ball.y<ball.r||ball.y>H-ball.r){ball.y=clamp(ball.y,ball.r,H-ball.r);ball.vy*=-1.02+Math.min(.12,ball.power*.03);wall()}
for(const g of gates){const dx=ball.x-g.x,dy=ball.y-g.y,l=Math.hypot(dx,dy);if(l<ball.r+g.r){const nx=dx/(l||1),ny=dy/(l||1),dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.x=g.x+nx*(ball.r+g.r+1);ball.y=g.y+ny*(ball.r+g.r+1);hitGate(g)}}}
const wx=boss.x+Math.cos(boss.a)*84,wy=boss.y+Math.sin(boss.a)*84;if(Math.hypot(ball.x-wx,ball.y-wy)<ball.r+21&&boss.hitCooldown<=0){boss.hitCooldown=.25;damage()}if(Math.hypot(ball.vx,ball.vy)<28){if(ball.orbitGate&&!ball.orbitUsed){beginOrbit(ball.orbitGate);return}endShot()}}
function circle(a,b,r,col,glow=0){x.save();x.fillStyle=col;x.shadowBlur=glow;x.shadowColor=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill();x.restore()}
function drawFrame(spec,cx,cy,frame=0,scale=spec.scale){const im=textures[spec.sprite];if(!im?.complete||!im.naturalWidth)return false;const dw=spec.fw*scale,dh=spec.fh*scale;x.drawImage(im,(frame%spec.frames)*spec.fw,0,spec.fw,spec.fh,Math.round(cx-dw/2),Math.round(cy-dh*.64),Math.round(dw),Math.round(dh));return true}
function drawStatic(name,cx,cy,size){const im=textures[staticArt[name]];if(!im?.complete||!im.naturalWidth)return false;x.drawImage(im,Math.round(cx-size/2),Math.round(cy-size/2),size,size);return true}
function drawArena(){x.fillStyle='#17112c';x.fillRect(0,0,W,H);for(let y=18;y<H-18;y+=16)for(let px=18;px<W-18;px+=16){const n=(px*17+y*31)%7;x.fillStyle=n===0?'#21183a':n===1?'#1c1532':'#19122d';x.fillRect(px,y,15,15)}x.fillStyle='#0f0a20';x.fillRect(12,12,W-24,H-24);x.globalAlpha=.55;for(let y=26;y<H-26;y+=20)for(let px=26;px<W-26;px+=20){const n=(px*13+y*7)%5;x.fillStyle=n===0?'#2d224a':'#241b3c';x.fillRect(px,y,18,18)}x.globalAlpha=1;x.strokeStyle='#9b7ade';x.lineWidth=3;x.strokeRect(9,9,W-18,H-18);x.strokeStyle='#2f2251';x.lineWidth=1;x.strokeRect(17,17,W-34,H-34);drawStatic('rock1',55,62,56);drawStatic('rock4',W-60,H-58,56);drawStatic('rock4',W-60,58,48);drawStatic('rock1',58,H-60,48)}
function draw(){drawArena();for(let i=1;i<ball.trail.length;i++){x.strokeStyle='#e4d7ff77';x.lineWidth=i/5;x.beginPath();x.moveTo(ball.trail[i-1].x,ball.trail[i-1].y);x.lineTo(ball.trail[i].x,ball.trail[i].y);x.stroke()}if(ball.relay){x.save();x.strokeStyle='#66f7d7';x.shadowBlur=13;x.shadowColor='#66f7d7';x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(ball.relay.from.x,ball.relay.from.y);x.lineTo(ball.relay.target.x,ball.relay.target.y);x.stroke();x.setLineDash([]);x.restore()}if(ball.orbit){x.save();x.strokeStyle='#ffe39c';x.shadowBlur=12;x.shadowColor='#ffcf65';x.lineWidth=2;x.beginPath();x.moveTo(ball.orbit.anchor.x,ball.orbit.anchor.y);x.lineTo(ball.x,ball.y);x.stroke();x.restore()}for(const g of gates){circle(g.x,g.y,g.r+5,'#171127');circle(g.x,g.y,g.r,g.col,g.on?32:13);circle(g.x,g.y,g.r-4,'#201932');if(!drawFrame(g,g.x,g.y,Math.floor(performance.now()/155),g.scale))circle(g.x,g.y,16,g.col,12);x.fillStyle='#fff4dc';x.font='10px ui-monospace';x.textAlign='center';x.fillText(g.s,g.x,g.y+45)}
x.save();x.translate(boss.x,boss.y);x.fillStyle='#251843';x.shadowBlur=34;x.shadowColor='#a286ff';x.beginPath();x.arc(0,0,79,0,Math.PI*2);x.fill();x.restore();if(boss.shield>0){x.save();x.strokeStyle='#87eaff';x.lineWidth=4;x.shadowBlur=12;x.shadowColor='#87eaff';x.beginPath();x.arc(boss.x,boss.y,87,-Math.PI/2,-Math.PI/2+Math.PI*2*(boss.shield/boss.maxShield));x.stroke();x.restore()}if(!drawFrame(bossArt,boss.x,boss.y,Math.floor(performance.now()/145)))circle(boss.x,boss.y,64,'#463672',30);const wx=boss.x+Math.cos(boss.a)*84,wy=boss.y+Math.sin(boss.a)*84;circle(wx,wy,21,'#ffce52',20);if(!drawStatic('weak',wx,wy,34))circle(wx,wy,12,'#fff0aa',20);x.fillStyle='#e5d8ff';x.font='11px ui-monospace';x.textAlign='center';x.fillText('공허의 왕',boss.x,boss.y+126);
if(drag&&!ball.moving){const dx=ball.x-drag.x,dy=ball.y-drag.y,l=Math.hypot(dx,dy)||1;x.setLineDash([6,6]);x.strokeStyle='#f4e9ff';x.lineWidth=2;x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(ball.x+dx/l*Math.min(150,l),ball.y+dy/l*Math.min(150,l));x.stroke();x.setLineDash([])}circle(ball.x,ball.y,ball.r+3,ball.moving?'#d9bdff':'#a989ff',ball.moving?25:16);if(!drawStatic('orb',ball.x,ball.y,31)){circle(ball.x,ball.y,ball.r,ball.moving?'#f6fdff':'#a6f5ff',ball.moving?24:16);circle(ball.x,ball.y,4,'#ffffff',2)}for(const p of popups){const a=1-p.t/.9;x.save();x.globalAlpha=a;x.fillStyle='#10091d';x.font=(p.big?'bold 22px':'bold 16px')+' ui-monospace';x.textAlign='center';x.fillText(p.text,p.x+2,p.y-p.t*34+2);x.fillStyle=p.col;x.fillText(p.text,p.x,p.y-p.t*34);x.restore()}}
function loop(t){const d=Math.min(.033,(t-last)/1000||0);last=t;update(d);if(boss&&ball)draw();requestAnimationFrame(loop)}
resetBuild();boss={x:667,y:220,hp:RULES.coreHp,maxHp:RULES.coreHp,shield:RULES.shield,maxShield:RULES.shield,a:0,hitCooldown:0};ball={x:150,y:422,r:13,trail:[]};sync();showRoster();requestAnimationFrame(loop);
