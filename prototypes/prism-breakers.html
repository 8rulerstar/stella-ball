if(drag&&!ball.moving){const dx=ball.x-drag.x,dy=ball.y-drag.y,l=Math.hypot(dx,dy)||1;x.setLineDash([6,6]);x.strokeStyle='#f4e9ff';x.lineWidth=2;x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(ball.x+dx/l*Math.min(150,l),ball.y+dy/l*Math.min(150,l));x.stroke();x.setLineDash([])}circle(ball.x,ball.y,ball.r+3,ball.moving?'#d9bdff':'#a989ff',ball.moving?25:16);if(!drawStatic('orb',ball.x,ball.y,31)){circle(ball.x,ball.y,ball.r,ball.moving?'#f6fdff':'#a6f5ff',ball.moving?24:16);circle(ball.x,ball.y,4,'#ffffff',2)}for(const p of popups){const a=1-p.t/.9;x.save();x.globalAlpha=a;x.fillStyle='#10091d';x.font=(p.big?'bold 22px':'bold 16px')+' ui-monospace';x.textAlign='center';x.fillText(p.text,p.x+2,p.y-p.t*34+2);x.fillStyle=p.col;x.fillText(p.text,p.x,p.y-p.t*34);x.restore()}}
function drawCombo(){if(!comboTimer||!boss)return;const riposte=hitCombo>=3,scale=1+comboPulse*.28;x.save();x.translate(boss.x,boss.y-112);x.scale(scale,scale);x.textAlign='center';x.font=(riposte?'bold 22px':'bold 15px')+' ui-monospace';x.fillStyle='#12091f';x.fillText(riposte?'RIPOSTE!':'COMBO x'+hitCombo,2,2);x.fillStyle=riposte?'#fff08f':'#f6d3ff';x.shadowBlur=riposte?18:8;x.shadowColor=x.fillStyle;x.fillText(riposte?'RIPOSTE!':'COMBO x'+hitCombo,0,0);x.restore()}
function loop(t){const d=Math.min(.033,(t-last)/1000||0);last=t;if(impactStop>0)impactStop-=d;else{update(d);updateSpecial(d)}updateFeedback(d);if(boss&&ball){draw();drawAssists();drawSpecial();drawCombo()}requestAnimationFrame(loop)}
resetBuild();boss={x:667,y:220,hp:RULES.coreHp,maxHp:RULES.coreHp,a:0,hitCooldown:0};ball={x:150,y:422,r:13,trail:[]};sync();showRoster();requestAnimationFrame(loop);
