<style>

ute;right:15px;top:83px;min-width:180px;padding:9px 11px;border:1px solid #d7b55c;background:#251a3ee8;color:#fff5c9;font:700 11px ui-monospace,monospace;opacity:0;transform:translateX(16px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(0)}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#0d0820e8;padding:30px}.overlay.hide{display:none}.overlay h2{margin:8px;font-size:34px;letter-spacing:-.06em}.overlay p{max-width:590px;margin:6px auto;color:#d5c7e7;font-size:14px;line-height:1.7}.overlay button,header button{border:1px solid #c9a8ff;border-radius:7px;background:#633da4;color:white;padding:10px 15px;font-weight:700;cursor:pointer}.overlay button:hover,header button:hover{background:#8158c4}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:660px;margin:15px auto}.choice-card{position:relative;min-height:126px;padding:12px;text-align:left;background:#211a35;border:1px solid #665081;color:#eee4fa}.choice-card:hover{transform:translateY(-3px);border-color:#fff2bc;background:#30234b}.choice-card .accent{display:block;width:100%;height:5px;margin-bottom:10px;background:var(--accent)}.choice-card strong{display:block;color:#fff4d1;font-size:14px}.choice-card small{display:block;margin-top:7px;color:#d3c4e6;font-size:11px;line-height:1.5}.choice-card em{display:block;margin-top:10px;color:var(--accent);font-style:normal;font:700 10px ui-monospace,monospace}.hero-card{min-height:104px;display:grid;grid-template-columns:56px 1fr;gap:7px;align-items:center}.hero-card .portrait{width:56px;height:56px;display:block;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #120d25)}.deploy-unit{cursor:grab;user-select:none}.deploy-unit:active{cursor:grabbing;opacity:.55}.deploy-unit.dragging{opacity:.35;transform:scale(.96)}.deployment-map{position:relative;width:min(660px,100%);height:210px;margin:12px auto 15px;border:1px solid #5b427f;border-r <body>
<main>
  <header>
    <div><div class="tag">반사 액션 × 파티 조합 / 수직 슬라이스</div><h1>PRISM BREAKERS</h1><p>한 발의 유물탄으로 동료 룬을 통과해 보스의 약점을 깨뜨린다.</p></div>

</main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;
x.imageSmoothingEnabled=false;
const U={shotsText:document.querySelector('#shotsText'),shotDots:document.querySelector('#shotDots'),phase:document.querySelector('#phaseText'),hp:document.querySelector('#hpText'),hpFill:document.querySelector('#hpFill'),power:document.querySelector('#powerText'),chain:document.querySelector('#chainText'),tip:document.querySelector('#tip'),over:document.querySelector('#overlay'),toast:document.querySelector('#toast'),summary:document.querySelector('#runeSummary'),momentum:document.querySelector('#momentumText'),flash:document.querySelector('#impactFlash')};
const stageEl=document.querySelector('.stage');

const RULES={baseDamage:16,chainStep:.55,shots:4,coreHp:240};
const heroes={

  biyeon:{n:'추적 사수 비연',s:'비연',e:'표식',d:'다음 약점 적중 피해를 크게 증폭합니다.',fx:'edge',col:'#ef718d',sprite:'../assets/characters/biyeon-archer-idle.png',fw:192,fh:192,frames:6,scale:.38},

  haru:{n:'연쇄 전령 하루',s:'하루',e:'릴레이',d:'다음 파티 룬으로 공을 전달합니다.',fx:'relay',col:'#9ee477',sprite:'../assets/characters/haru-lancer-idle.png',fw:320,fh:320,frames:12,scale:.25},
  sera:{n:'궤도 사제 세라',s:'세라',e:'원심',d:'공이 멈추면 줄로 연결해 한 번 더 회전 발사합니다.',fx:'orbit',col:'#bca7ff',sprite:'../assets/characters/sera-monk-idle.png',fw:192,fh:192,frames:6,scale:.38},
  taeo:{n:'폭파 광부 태오',s:'태오',e:'충격',d:'다음 벽 충돌에서 폭발적으로 가속합니다.',fx:'mine',col:'#ffac67',sprite:'../assets/characters/taeo-miner-idle.png',fw:192,fh:192,frames:8,scale:.38},
  nyx:{n:'성위 관측자 닉스',s:'닉스',e:'성위 고정',d:'세 번째 룬 충돌에 유물탄을 약점 유도탄으로 바꿉니다.',fx:'lockon',col:'#9f83ff',sprite:'../assets/characters/nyx-oracle-idle.png',fw:192,fh:192,frames:8,scale:.38},
  rio:{n:'나침반 기사 리오',s:'리오',e:'우회전 명령',d:'룬 충돌 뒤 화면 클릭 한 번으로 공을 오른쪽으로 90° 꺾습니다.',fx:'turn',col:'#ff737d',sprite:'../assets/characters/rio-compass-idle.png',fw:320,fh:320,frames:12,scale:.25}

const stages=[

  {id:'02',name:'침식의 계단',terrain:'룬석이 계단처럼 이어집니다. 가운데에서 궤적을 꺾어 약점의 높이를 맞춰야 합니다.',slots:[[284,126],[485,270],[328,408]],preview:[[25,28],[56,54],[27,79]],boss:{x:707,y:214},labels:['상단 계단','중앙 계단','하단 귀환점']},
  {id:'03',name:'원심 정원',terrain:'세 룬석이 보스 주변을 감쌉니다. 멈춘 공을 되살리는 원심 연계가 빛납니다.',slots:[[372,126],[348,407],[596,302]],preview:[[29,28],[29,78],[73,57]],boss:{x:696,y:263},labels:['상단 고리','하단 고리','보스 옆 고리']}
];
const bossArt={sprite:'../assets/bosses/void-troll-idle.png',fw:384,fh:384,frames:12,scale:.48};
const staticArt={orb:'../assets/original/prism-orb.svg',weak:'../assets/original/weakpoint.svg',rock1:'../assets/terrain/rock-01.png',rock4:'../assets/terrain/rock-04.png'};
const textures={};for(const spec of [...Object.values(heroes),bossArt]){const im=new Image();im.src=spec.sprite;textures[spec.sprite]=im}for(const path of Object.values(staticArt)){const im=new Image();im.src=path;textures[path]=im}
const upgrades=[
  {id:'lens',tag:'약점',title:'균열 렌즈',text:'약점 피해가 +7 증가합니다.',accent:'#ffd36d',apply:b=>b.weakFlat+=7},
  {id:'chorus',tag:'연계',title:'공명 코일',text:'룬 하나당 연계 배율이 +16% 증가합니다.',accent:'#83e8f5',apply:b=>b.chainStep+=.16},
  {id:'reserve',tag:'발사',title:'예비 탄창',text:'이후 단계의 발사 횟수가 +1 증가합니다.',accent:'#f6a6ce',apply:b=>b.extraShots+=1},
  {id:'kinetic',tag:'반사',title:'운동량 프레임',text:'벽 반사마다 피해가 +8% 증가합니다.',accent:'#9ee477',apply:b=>b.bounceStep+=.08},
  {id:'mark',tag:'표식',title:'사냥꾼의 눈',text:'표식 룬의 약점 피해 배율이 1.38 → 1.70이 됩니다.',accent:'#ef718d',apply:b=>b.markMultiplier=1.70},
  {id:'battery',tag:'공명',title:'위상 공명기',text:'모든 보스 피해가 +9 증가합니다.',accent:'#bca7ff',apply:b=>b.weakFlat+=9}
];
let selected=['gaon','biyeon','lumi'],deployed=['gaon','biyeon','lumi'],stageIndex=0,placementPick=null;
let build,ball,boss,gates=[],battle,drag=null,run=false,chain=[],popups=[],assistShots=[],last=0,toastTimer=0,impactStop=0,screenShake=0,screenFlash=0,hitCombo=0,comboTimer=0,comboPulse=0,msg='파티를 편성하세요.';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const currentStage=()=>stages[stageIndex];
function resetBuild(){build={weakFlat:0,chainStep:0,extraShots:0,bounceStep:0,markMultiplier:1.7,names:[]}}
function setupBattle(){const s=currentStage();battle={shotMax:RULES.shots+build.extraShots,shots:RULES.shots+build.extraShots};boss={...s.boss,hp:RULES.coreHp,maxHp:RULES.coreHp,a:0,hitCooldown:0};ball=null;assistShots=[];hitCombo=0;comboTimer=0;startShot();run=true;U.over.classList.add('hide');msg=s.name+' · 고정 룬석에 배치한 파티로 공허의 왕을 무너뜨리세요.';toast(s.id+' · '+s.name);sync()}
function startShot(){const s=currentStage(),rest=ball&&Number.isFinite(ball.x)?{x:ball.x,y:ball.y}:{x:150,y:422};ball={x:clamp(rest.x,18,W-18),y:clamp(rest.y,18,H-18),vx:0,vy:0,r:13,moving:false,trail:[],power:0,bounces:0};gates=deployed.map((id,i)=>({id,...heroes[id],x:s.slots[i][0],y:s.slots[i][1],r:31,on:0,slot:s.labels[i]}));chain=[];drag=null}
function showRoster(){run=false;const s=currentStage();U.over.innerHTML='<div class="tag">스테이지 선택 · 파티 편성</div><h2>고정 룬석에 맞출 세 명을 고르세요.</h2><p><b>'+s.id+' · '+s.name+'</b> — '+s.terrain+'</p><div id="stageChoices" class="choice-grid" style="max-width:660px;margin-top:10px"></div><div id="roster" class="choice-grid" style="max-width:660px"></div><button id="startTeam">룬석 배치로 이동</button>';const stageBox=document.querySelector('#stageChoices');for(const [i,st] of stages.entries()){const b=document.createElement('button');b.className='choice-card';b.style.cssText='min-height:74px;text-align:left;border-color:'+(i===stageIndex?'#ffe596':'#665081');b.innerHTML='<strong>'+st.id+' · '+st.name+'</strong><small>'+st.terrain+'</small>';b.onclick=()=>{stageIndex=i;showRoster()};stageBox.append(b)}const box=document.querySelector('#roster');Object.entries(heroes).forEach(([id,h])=>{const on=selected.includes(id),b=document.createElement('button');b.className='hero-card';b.innerHTML='<span class="portrait"></span><span><b>'+h.n+'</b><br>'+h.e+' · '+h.d+'</span>';b.style.cssText='text-align:left;margin:0;padding:9px;background:'+(on?h.col:'#211a35')+';color:'+(on?'#24172c':'#eadfff')+';border-color:'+h.col;const p=b.querySelector('.portrait');p.style.backgroundImage='url("'+h.sprite+'")';p.style.backgroundSize=(h.frames*56)+'px 56px';b.onclick=()=>{if(selected.includes(id))selected=selected.filter(v=>v!==id);else if(selected.length<3)selected.push(id);showRoster()};box.append(b)});document.querySelector('#startTeam').onclick=()=>{if(selected.length!==3)return alert('세 명을 선택해주세요.');deployed=[...selected];placementPick=deployed[0];showDeployment()};U.over.classList.remove('hide')}
function showDeployment(){run=false;const s=currentStage(),placeUnit=(incoming,i)=>{const from=deployed.indexOf(incoming);if(from>=0&&from!==i)[deployed[from],deployed[i]]=[deployed[i],deployed[from]];placementPick=null;showDeployment()};U.over.innerHTML='<div class="tag">고정 룬석 배치</div><h2>'+s.id+' · '+s.name+'</h2><p>파티 유닛을 <b>끌어 고정 룬석에 놓으세요.</b> 놓은 자리에 있던 유닛과 즉시 교체됩니다.</p><div id="deployHeroes" class="choice-grid" style="max-width:660px"></div><div id="slotChoices" class="deployment-map"><span class="map-boss">● 공허의 왕</span></div><button id="startBattle">전투 각인 선택</button>';const heroBox=document.querySelector('#deployHeroes'),slotBox=document.querySelector('#slotChoices');for(const id of selected){const h=heroes[id],b=document.createElement('div');b.className='choice-card deploy-unit';b.draggable=true;b.innerHTML='<strong>'+h.s+' · '+h.e+'</strong><small>'+h.d+'</small>';b.style.borderColor=h.col;b.addEventListener('pointerdown',()=>{placementPick=id;b.classList.add('dragging')});b.addEventListener('pointerup',()=>b.classList.remove('dragging'));b.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);b.classList.add('dragging')});b.addEventListener('dragend',()=>b.classList.remove('dragging'));heroBox.append(b)}for(let i=0;i<3;i++){const id=deployed[i],h=heroes[id],slot=document.createElement('div');slot.className='slot-card';slot.style.left=s.preview[i][0]+'%';slot.style.top=s.preview[i][1]+'%';slot.innerHTML='<strong>룬석 '+(i+1)+' · '+s.labels[i]+'</strong><small><b style="color:'+h.col+'">'+h.s+'</b> 배치됨 · '+h.e+'</small>';slot.addEventListener('pointerup',()=>{if(placementPick)placeUnit(placementPick,i)});slot.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';slot.classList.add('drop-ready')});slot.addEventListener('dragleave',()=>slot.classList.remove('drop-ready'));slot.addEventListener('drop',e=>{e.preventDefault();placeUnit(e.dataTransfer.getData('text/plain'),i)});slotBox.append(slot)}document.querySelector('#startBattle').onclick=()=>{resetBuild();showDraft('전투 각인','첫 발사 전에 유물 강화 하나를 고르세요.',setupBattle)};U.over.classList.remove('hide')}
function showDeployment(){
  run=false;

function updateSpecial(d){if(ball?.runeBurst)ball.runeBurst=Math.max(0,ball.runeBurst-d);if(U.momentum&&ball)U.momentum.textContent=Math.round(Math.hypot(ball.vx||0,ball.vy||0));if(!run||!ball?.homing||ball.relay||ball.orbit)return;const wx=boss.x+Math.cos(boss.a)*84,wy=boss.y+Math.sin(boss.a)*84,dx=wx-ball.x,dy=wy-ball.y,l=Math.hypot(dx,dy)||1;ball.vx=dx/l*920;ball.vy=dy/l*920}
function drawSpecial(){if(!ball?.moving)return;if(ball.runeBurst){x.save();x.globalAlpha=Math.min(1,ball.runeBurst*3);x.strokeStyle='#fff5b5';x.shadowBlur=18;x.shadowColor='#ffcb64';x.lineWidth=3;x.beginPath();x.arc(ball.x,ball.y,ball.r+9,0,Math.PI*2);x.stroke();x.restore()}if(ball.homing){x.save();x.strokeStyle='#fff09d';x.shadowBlur=14;x.shadowColor='#fff09d';x.lineWidth=2;x.beginPath();x.arc(ball.x,ball.y,ball.r+8,0,Math.PI*2);x.stroke();x.restore()}if(ball.orbit){const charge=Math.min(100,Math.round(ball.orbit.t/1.2*100));x.save();x.fillStyle='#ffe49b';x.font='bold 11px ui-monospace';x.textAlign='center';x.fillText('클릭 · 원심 발사 '+charge+'%',ball.x,ball.y-28);x.restore()}else if(ball.turnReady&&!ball.turnUsed){x.save();x.fillStyle='#ff8d95';x.font='bold 11px ui-monospace';x.textAlign='center';x.fillText('클릭 · 우회전 충격',ball.x,ball.y-27);x.restore()}}
function drawFrame(spec,cx,cy,frame=0,scale=spec.scale){const im=textures[spec.sprite];if(!im?.complete||!im.naturalWidth)return false;const dw=spec.fw*scale,dh=spec.fh*scale;x.drawImage(im,(frame%spec.frames)*spec.fw,0,spec.fw,spec.fh,Math.round(cx-dw/2),Math.round(cy-dh*.64),Math.round(dw),Math.round(dh));return true}
function drawStatic(name,cx,cy,size){const im=textures[staticArt[name]];if(!im?.complete||!im.naturalWidth)return false;x.drawImage(im,Math.round(cx-size/2),Math.round(cy-size/2),size,size);return true}
function drawArena(){x.fillStyle='#17112c';x.fillRect(0,0,W,H);for(let y=18;y<H-18;y+=16)for(let px=18;px<W-18;px+=16){const n=(px*17+y*31)%7;x.fillStyle=n===0?'#21183a':n===1?'#1c1532':'#19122d';x.fillRect(px,y,15,15)}x.fillStyle='#0f0a20';x.fillRect(12,12,W-24,H-24);x.globalAlpha=.55;for(let y=26;y<H-26;y+=20)for(let px=26;px<W-26;px+=20){const n=(px*13+y*7)%5;x.fillStyle=n===0?'#2d224a':'#241b3c';x.fillRect(px,y,18,18)}x.globalAlpha=1;x.strokeStyle='#9b7ade';x.lineWidth=3;x.strokeRect(9,9,W-18,H-18);x.strokeStyle='#2f2251';x.lineWidth=1;x.strokeRect(17,17,W-34,H-34);drawStatic('rock1',55,62,56);drawStatic('rock4',W-60,H-58,56);drawStatic('rock4',W-60,58,48);drawStatic('rock1',58,H-60,48)}
function draw(){drawArena();for(let i=1;i<ball.trail.length;i++){x.strokeStyle='#e4d7ff77';x.lineWidth=i/5;x.beginPath();x.moveTo(ball.trail[i-1].x,ball.trail[i-1].y);x.lineTo(ball.trail[i].x,ball.trail[i].y);x.stroke()}if(ball.relay){x.save();x.strokeStyle='#66f7d7';x.shadowBlur=13;x.shadowColor='#66f7d7';x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(ball.relay.from.x,ball.relay.from.y);x.lineTo(ball.relay.target.x,ball.relay.target.y);x.stroke();x.setLineDash([]);x.restore()}if(ball.orbit){x.save();x.strokeStyle='#ffe39c';x.shadowBlur=12;x.shadowColor='#ffcf65';x.lineWidth=2;x.beginPath();x.moveTo(ball.orbit.anchor.x,ball.orbit.anchor.y);x.lineTo(ball.x,ball.y);x.stroke();x.restore()}for(const g of gates){circle(g.x,g.y,g.r+5,'#171127');circle(g.x,g.y,g.r,g.col,g.on?32:13);circle(g.x,g.y,g.r-4,'#201932');if(!drawFrame(g,g.x,g.y,Math.floor(performance.now()/155),g.scale))circle(g.x,g.y,16,g.col,12);x.fillStyle='#fff4dc';x.font='10px ui-monospace';x.textAlign='center';x.fillText(g.s,g.x,g.y+45)}
x.save();x.translate(boss.x,boss.y);x.fillStyle='#251843';x.shadowBlur=34;x.shadowColor='#a286ff';x.beginPath();x.arc(0,0,79,0,Math.PI*2);x.fill();x.restore();if(!drawFrame(bossArt,boss.x,boss.y,Math.floor(performance.now()/145)))circle(boss.x,boss.y,64,'#463672',30);const wx=boss.x+Math.cos(boss.a)*84,wy=boss.y+Math.sin(boss.a)*84;circle(wx,wy,21,'#ffce52',20);if(!drawStatic('weak',wx,wy,34))circle(wx,wy,12,'#fff0aa',20);x.fillStyle='#e5d8ff';x.font='11px ui-monospace';x.textAlign='center';x.fillText('공허의 왕',boss.x,boss.y+126);
if(drag&&!ball.moving){const dx=ball.x-drag.x,dy=ball.y-drag.y,l=Math.hypot(dx,dy)||1;x.setLineDash([6,6]);x.strokeStyle='#f4e9ff';x.lineWidth=2;x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(ball.x+dx/l*Math.min(150,l),ball.y+dy/l*Math.min(150,l));x.stroke();x.setLineDash([])}circle(ball.x,ball.y,ball.r+3,ball.moving?'#d9bdff':'#a989ff',ball.moving?25:16);if(!drawStatic('orb',ball.x,ball.y,31)){circle(ball.x,ball.y,ball.r,ball.moving?'#f6fdff':'#a6f5ff',ball.moving?24:16);circle(ball.x,ball.y,4,'#ffffff',2)}for(const p of popups){const a=1-p.t/.9;x.save();x.globalAlpha=a;x.fillStyle='#10091d';x.font=(p.big?'bold 22px':'bold 16px')+' ui-monospace';x.textAlign='center';x.fillText(p.text,p.x+2,p.y-p.t*34+2);x.fillStyle=p.col;x.fillText(p.text,p.x,p.y-p.t*34);x.restore()}}
function drawCombo(){if(!comboTimer||!boss)return;const riposte=hitCombo>=3,scale=1+comboPulse*.28;x.save();x.translate(boss.x,boss.y-112);x.scale(scale,scale);x.textAlign='center';x.font=(riposte?'bold 22px':'bold 15px')+' ui-monospace';x.fillStyle='#12091f';x.fillText(riposte?'RIPOSTE!':'COMBO x'+hitCombo,2,2);x.fillStyle=riposte?'#fff08f':'#f6d3ff';x.shadowBlur=riposte?18:8;x.shadowColor=x.fillStyle;x.fillText(riposte?'RIPOSTE!':'COMBO x'+hitCombo,0,0);x.restore()}
function loop(t){const d=Math.min(.033,(t-last)/1000||0);last=t;if(impactStop>0)impactStop-=d;else{update(d);updateSpecial(d)}updateFeedback(d);if(boss&&ball){draw();drawAssists();drawSpecial();drawCombo()}requestAnimationFrame(loop)}
resetBuild();boss={x:667,y:220,hp:RULES.coreHp,maxHp:RULES.coreHp,a:0,hitCooldown:0};ball={x:150,y:422,r:13,trail:[]};sync();showRoster();requestAnimationFrame(loop);
