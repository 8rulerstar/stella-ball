<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STELLA BALL</title>
  <link
    rel="icon"
    type="image/png"
    href="../assets/library/brand/favicon-32.png"
  />
  <!-- Styles are split by responsibility but must load in this order. -->
  <link rel="stylesheet" href="./prism-breakers-foundation.css" />
  <link rel="stylesheet" href="./prism-breakers-interface.css" />
  <link rel="stylesheet" href="./prism-breakers-combat.css" />
  <link rel="stylesheet" href="./prism-breakers-story.css" />
  <link rel="stylesheet" href="./prism-breakers-polish.css" />
  <!-- Final visual pass: Ink & Brass theme. Keep this stylesheet last. -->
  <link rel="stylesheet" href="./stella-ball-theme.css" />
  <!-- Dawn pass: pixel button kit + sky decor. Keep after the theme. -->
  <link rel="stylesheet" href="./stella-ball-dawn.css" />
  <body>
    <main>
      <header>
        <div>
          <div class="tag">전략 당구 × 파티 조합 / 수직 슬라이스</div>
          <h1>STELLA BALL</h1>
          <p>
            유성을 굴려 잠든 별지기를 깨우세요. 그들이 멈춘 자리가 별자리가
            됩니다.
          </p>
        </div>
        <button onclick="showMeta()">메인</button>
      </header>
      <div class="battle-layout">
        <aside class="combat-dashboard" aria-label="전투 상태">
          <div class="hud">
            <section class="hud-card">
              <div class="hud-label">
                <span>남은 유성</span><b id="shotsText">4 / 4</b>
              </div>
              <div class="shot-dots" id="shotDots">● ● ● ●</div>
            </section>
            <section class="hud-card">
              <div class="hud-label">
                <span>약점 위력</span><b id="powerText">16</b>
              </div>
              <div class="status-line">
                <span>별빛 연계</span><b id="chainText">—</b>
              </div>
              <div class="status-line">
                <span>운동량</span><b id="momentumText">—</b>
              </div>
            </section>
          </div>
          <section
            class="blaze-card"
            id="blazeCard"
            data-heat="0"
            aria-live="polite"
            title="별지기들이 멈춘 자리가 별자리를 이룹니다. 크게, 대담하게 그릴수록 강해집니다."
          >
            <span class="blaze-score-label">CONSTELLATION</span
            ><b id="blazeValue">×1.0</b
            ><small id="blazeDetail">별자리 배율 대기</small>
          </section>
        </aside>
        <div class="battle-column">
          <section class="boss-panel boss-banner">
            <div class="phase" id="phaseText">전투 · 공허 거상</div>
            <div class="boss-name">
              <span>공허 거상</span><b id="hpText">체력 240</b>
            </div>
            <div class="meter hp"><i id="hpFill"></i></div>
            <div class="combo-readout" id="comboText">COMBO —</div>
          </section>
          <section class="stage">
            <canvas id="game" width="720" height="900"></canvas>
            <div class="toast" id="toast"></div>
            <div class="impact-flash" id="impactFlash"></div>
            <div class="tip" id="tip" aria-live="polite"></div>
            <div id="overlay" class="overlay"></div>
            <div
              class="onboarding-dock"
              id="onboardingDock"
              aria-live="polite"
            ></div>
          </section>
        </div>
      </div>
      <section class="runes" id="runeSummary"></section>
    </main>
    <script src="../hive/prism-hive-client.js"></script>
    <!-- Classic scripts intentionally share one global scope. Keep this order. -->
    <script src="./js/game-platform.js"></script>
    <script src="./js/game-data.js"></script>
    <script src="./js/game-ui.js"></script>
    <script src="./js/game-session.js"></script>
    <script src="./js/game-core-physics.js"></script>
    <script src="./js/game-core-render.js"></script>
    <script src="./js/game-meta.js"></script>
    <script src="./js/game-combat.js"></script>
    <script src="./js/game-feedback.js"></script>
    <script src="./js/game-onboarding.js"></script>
    <script src="./js/game-bootstrap.js"></script>
    <script src="./stella-ball-pixel-ui.js"></script>
    <script src="./stella-ball-dawn.js"></script>
  </body>
</html>
