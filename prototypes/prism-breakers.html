function modernUpdate(d){

  for(const key of ['left','right']){const rising=(flippers[key+'Strike']||0)>0;flippers[key]=rising?Math.min(1,(flippers[key]||0)+d/PHYSICS.flipperRise):Math.max(0,(flippers[key]||0)-d/PHYSICS.flipperFall);flippers[key+'Strike']=Math.max(0,(flippers[key+'Strike']||0)-d)}
  for(const p of popups)p.t+=d;popups=popups.filter(p=>p.t<.9);
  for(const a of adds){a.hitCooldown=Math.max(0,a.hitCooldown-d);a.frozen=Math.max(0,(a.frozen||0)-d);if(a.down>0){a.down-=d;if(a.down<=0){a.down=0;a.hp=a.maxHp;toast('공허 잔재 재생성')}}}
  if(!run)return;
  if(battle.victory){boss.a+=d*.12;return}
  battle.slow=Math.max(0,(battle.slow||0)-d);boss.a+=d*.62*(battle.slow>0?.24:1);boss.hitCooldown=Math.max(0,boss.hitCooldown-d);
  for(const g of gates)g.on=Math.max(0,g.on-d);for(const b of bumpers)b.on=Math.max(0,b.on-d);
  if(!ball.moving)return;
  if(ball.relay){updateRelay(d);return}if(ball.orbit){updateOrbit(d);return}
  simulatePhysics(d);
}

function drawFeedbackBeats(){
  for(const beat of feedbackBeats){
    const p=Math.min(1,beat.t/beat.d),fade=1-p,size=(28+76*p)*beat.power;
    if(beat.kind==='wall')paintElectricRing(beat.x,beat.y,size*1.22,p,fade*.8);
    else if(beat.kind==='weak')paintFeedbackAsset(feedbackArt.impact,beat.x,beat.y,size*1.85,fade*.8,p*.7);
    else if(beat.kind==='riposte')paintFeedbackAsset(feedbackArt.comet,beat.x,beat.y,size*2.1,fade*.88,-Math.PI*.25+p*.55);
    else if(beat.kind==='unit'||beat.kind==='awaken')paintFeedbackAsset(feedbackArt.shockwave,beat.x,beat.y,size*1.8,fade*.54,-p*1.7);
    else if(beat.kind==='hit')paintFeedbackAsset(feedbackArt.burst,beat.x,beat.y,size*1.36,fade*.75,p*.5);
    x.save();x.globalAlpha=fade;x.translate(beat.x,beat.y);x.strokeStyle=beat.col;x.fillStyle=beat.col;x.shadowBlur=16;x.shadowColor=beat.col;
    if(beat.kind==='unit'||beat.kind==='awaken'){for(let i=0;i<8;i++){const a=i*Math.PI/4+p*1.4,inner=10,outer=size*.48;x.lineWidth=i%2?2:4;x.beginPath();x.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);x.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);x.stroke()}}
    else if(beat.kind==='weak'||beat.kind==='riposte'){for(let i=0;i<3;i++){x.lineWidth=3+i;x.beginPath();x.arc(0,0,size*(.18+i*.13),p*4+i,Math.PI*2+p*4+i);x.stroke()}for(let i=0;i<8;i++){const a=i*Math.PI/4-p*3;x.fillRect(Math.cos(a)*size*.46-3,Math.sin(a)*size*.46-3,6,6)}}
    else{x.lineWidth=3;x.beginPath();x.arc(0,0,size*.34,0,Math.PI*2);x.stroke();x.lineWidth=1;x.beginPath();x.arc(0,0,size*.52,0,Math.PI*2);x.stroke()}
    if(beat.label&&p<.7){x.globalAlpha=fade*1.3;x.font='bold 12px ui-monospace';x.textAlign='center';x.fillText(beat.label,0,-size*.55)}
    x.restore();
  }
}
