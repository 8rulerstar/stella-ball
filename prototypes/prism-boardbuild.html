<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Breakers · Boardbuild Prototype</title><style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#edf2e9;background:#07131b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#2d5961,#07131b 62%)}body{display:grid;place-items:center}main{width:min(760px,100vw);padding:12px}.shell{overflow:hidden;border:1px solid #6b9390;border-radius:18px;background:#091921;box-shadow:0 25px 80px #000b}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #375c62;background:#0b2029}.top small{display:block;color:#8eb7af;font:700 9px ui-monospace;letter-spacing:.11em}.top b{color:#f2d98f;font-size:17px}.top aside{text-align:right;color:#dce9e3;font-size:11px}.board{position:relative}canvas{display:block;width:100%;height:auto;touch-action:none}.hud{position:absolute;inset:11px 13px auto;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:7px;pointer-events:none}.hud div{padding:7px 9px;border:1px solid #4d7476;background:#08171eee;color:#b9d1ca;font:700 10px ui-monospace}.hud div:nth-child(2){text-align:center}.hud b{display:block;color:#f3cd75;font-size:12px}.meter{height:6px;margin-top:4px;border:1px solid #34595d;background:#12262e}.meter i{display:block;width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,#be554c,#e5a25a)}.bottom{padding:9px 12px 12px;border-top:1px solid #365b60;background:#0c1f27}.message{min-height:19px;margin:0 0 7px;text-align:center;color:#d4e2dc;font-size:11px}.buildbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.unit{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;min-height:46px;padding:5px;border:1px solid #476d70;background:#102832;color:#edf0e7;text-align:left;cursor:grab}.unit:active{cursor:grabbing}.unit.active{border-color:#f0c86d;background:#1a3b42;box-shadow:0 0 0 2px #f0c86d44}.unit i{display:grid;place-items:center;width:27px;height:27px;border:1px solid currentColor;border-radius:50%;font:700 13px ui-monospace;font-style:normal}.unit b{display:block;font-size:10px}.unit small{display:block;color:#b6cdc7;font-size:8px}.gaon{color:#f2c56b}.lumi{color:#72dce1}.haru{color:#9ee477}.sera{color:#ceb0ff}.overlay{position:absolute;inset:0;z-index:2;display:grid;place-content:center;padding:20px;background:#07131be8;text-align:center}.overlay.hide{display:none}.overlay section{width:min(540px,100%);padding:22px;border:1px solid #6b9390;background:#0a1c24;box-shadow:0 12px 35px #000b}.overlay small{color:#91bbb4;font:700 10px ui-monospace;letter-spacing:.12em}.overlay h1{margin:5px;color:#f2d98f;font-size:29px;letter-spacing:-.06em}.overlay p{color:#d6e3dd;font-size:12px;line-height:1.65}.slot-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.slot{min-height:104px;padding:8px;border:1px dashed #729c97;background:#102730;text-align:left}.slot.ready{border-color:#f0c86d;background:#1b383d}.slot small{color:#9dc1bb;font-size:8px}.slot b{display:block;margin-top:8px;color:#f1e8cf;font-size:13px}.slot em{display:block;margin-top:4px;color:#bad2cb;font-size:9px;font-style:normal}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions button{border:1px solid #eec66e;background:#8a6335;color:#fff5d7;padding:10px 16px;font-weight:800;cursor:pointer}@media(max-width:620px){main{padding:0}.shell{border:0;border-radius:0}.hud{inset:7px;gap:4px}.hud div{padding:5px;font-size:8px}.hud b{font-size:10px}.buildbar{gap:3px}.unit{grid-template-columns:1fr;padding:4px;text-align:center}.unit i{margin:auto}.unit small{display:none}.slot-row{gap:4px}.slot{min-height:90px;padding:5px}.overlay section{padding:16px}}
</style></head><body><main><section class="shell"><header class="top"><div><small>PEGGLE × PARTY BOARDBUILD</small><b>PRISM BREAKERS</b></div><aside>FRACTURE 01<br><b>균열 회랑</b></aside></header><div class="board"><canvas id="game" width="720" height="900"></canvas><div class="hud"><div>발사 <b id="shots">1 / 3</b></div><div>공허의 왕 <b id="hp">160</b><span class="meter"><i id="fill"></i></span></div><div>공명 <b id="energy">0</b></div></div><div class="overlay" id="overlay"><section><small>BUILD THE BOARD</small><h1>룬 보드빌드</h1><p>유닛을 고정 슬롯에 배치해 <b>전장 구조물</b>을 만드세요.<br>전투에서는 위쪽 발사대를 좌우로 드래그해 한 발을 떨어뜨립니다.</p><div class="slot-row" id="slots"></div><div class="actions"><span id="buildHint">유닛을 선택한 뒤 슬롯을 누르세요.</span><button id="battle">보드 완성 · 출발</button></div></section></div></div><footer class="bottom"><p class="message" id="message">파티를 배치하면 각 유닛이 전장 구조물이 됩니다.</p><div class="buildbar" id="units"></div></footer></section></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;const U={shots:document.querySelector('#shots'),hp:document.querySelector('#hp'),fill:document.querySelector('#fill'),energy:document.querySelector('#energy'),message:document.querySelector('#message'),overlay:document.querySelector('#overlay'),slots:document.querySelector('#slots'),units:document.querySelector('#units')};const heroes={gaon:{name:'가온',skill:'반사 패널',kind:'gaon',col:'#f2c56b',hint:'대각 반사판'},lumi:{name:'루미',skill:'중력장',kind:'lumi',col:'#72dce1',hint:'약점 유도장'},haru:{name:'하루',skill:'워프 관문',kind:'haru',col:'#9ee477',hint:'입·출구 관문'},sera:{name:'세라',skill:'원심 고리',kind:'sera',col:'#ceb0ff',hint:'한 번 더 회전'}};const slotInfo=[{name:'좌측 균열',x:144,y:410},{name:'중앙 성위',x:360,y:390},{name:'우측 균열',x:576,y:410}];let selected='gaon',deployed=['gaon','lumi','haru'],ball,boss,pegs,run=false,drag=null,last=0,shots=0,energy=0,flash=0,weakA=0,gates=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function setMessage(t){U.message.textContent=t}function sync(){U.shots.textContent=(shots+1)+' / 3';U.hp.textContent=Math.max(0,Math.ceil(boss.hp));U.fill.style.transform='scaleX('+Math.max(0,boss.hp/boss.maxHp)+')';U.energy.textContent=energy;}
function buildMenu(){U.slots.innerHTML=slotInfo.map((s,i)=>{const h=heroes[deployed[i]];return '<button class="slot '+(selected===deployed[i]?'ready':'')+'" data-slot="'+i+'"><small>'+s.name+'</small><b style="color:'+h.col+'">'+h.name+'</b><em>'+h.hint+'</em></button>'}).join('');U.units.innerHTML=Object.entries(heroes).map(([id,h])=>'<button class="unit '+h.kind+(id===selected?' active':'')+'" data-unit="'+id+'"><i>'+h.name[0]+'</i><span><b>'+h.name+'</b><small>'+h.skill+'</small></span></button>').join('');for(const b of U.units.querySelectorAll('[data-unit]'))b.onclick=()=>{selected=b.dataset.unit;buildMenu()};for(const s of U.slots.querySelectorAll('[data-slot]'))s.onclick=()=>{deployed[Number(s.dataset.slot)]=selected;buildMenu()};}
function reset(){ball={x:360,y:110,r:12,vx:0,vy:0,moving:false,trail:[],cool:0};boss={x:360,y:734,r:58,hp:160,maxHp:160,cool:0};pegs=[];for(let row=0;row<4;row++)for(let col=0;col<4;col++)pegs.push({x:185+col*116+(row%2)*44,y:230+row*84,r:12,on:0,alive:true});shots=0;energy=0;flash=0;weakA=0;gates=[];for(let i=0;i<3;i++){const id=deployed[i],slot=slotInfo[i];if(id==='gaon')gates.push({kind:'panel',x:slot.x,y:slot.y,angle:i===0?-.72:.72,col:heroes[id].col});if(id==='lumi')gates.push({kind:'gravity',x:slot.x,y:slot.y,col:heroes[id].col});if(id==='haru')gates.push({kind:'warp',x:slot.x,y:slot.y,col:heroes[id].col});if(id==='sera')gates.push({kind:'orbit',x:slot.x,y:slot.y,col:heroes[id].col});}const warps=gates.filter(v=>v.kind==='warp');if(warps.length===1)warps.push({kind:'warp',x:W-warps[0].x,y:570,col:warps[0].col,exit:true});sync();setMessage('발사대를 좌우로 드래그해 공을 떨어뜨리세요.');}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function launch(p){const dx=clamp(p.x-ball.x,-170,170);ball.vx=dx*3.4;ball.vy=260;ball.moving=true;setMessage('보드가 만든 경로를 따라 공명이 쌓입니다.');}
function bounceCircle(o,rest=1,onHit){const dx=ball.x-o.x,dy=ball.y-o.y,l=Math.hypot(dx,dy)||1,reach=ball.r+o.r;if(l>=reach)return false;const nx=dx/l,ny=dy/l,dot=ball.vx*nx+ball.vy*ny;ball.x=o.x+nx*(reach+1);ball.y=o.y+ny*(reach+1);if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.vx*=rest;ball.vy*=rest;onHit?.()}return true}function damage(weak){if(boss.cool>0)return;boss.cool=.28;const amount=weak?34+energy*3:10+energy;boss.hp=Math.max(0,boss.hp-amount);flash=weak?1:.4;setMessage(weak?'약점 관통! '+amount+' 피해':'코어 접촉 '+amount+' 피해');if(boss.hp<=0){run=false;U.overlay.classList.remove('hide');U.overlay.innerHTML='<section><small>BOARD SOLVED</small><h1>균열 정화</h1><p>'+shots+'발로 보스를 무너뜨렸습니다.<br>다른 배치로 더 짧은 공명 경로를 만드세요.</p><button id="again">같은 보드 다시 하기</button></section>';document.querySelector('#again').onclick=()=>{reset();run=true;U.overlay.classList.add('hide')}}sync()}
function settle(){ball.moving=false;shots++;energy=0;if(shots>=3&&boss.hp>0){run=false;setMessage('균열이 닫혔습니다. 유닛 배치와 발사선을 바꿔보세요.')}else setMessage('공이 멈췄습니다. 위쪽 발사대에서 다음 공을 떨어뜨리세요.');sync()}
function update(dt){if(!run)return;weakA+=dt*.72;boss.cool=Math.max(0,boss.cool-dt);flash=Math.max(0,flash-dt*2.6);for(const p of pegs)p.on=Math.max(0,p.on-dt);if(!ball.moving)return;ball.vy+=310*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.998,dt*60);ball.vy*=Math.pow(.998,dt*60);if(ball.x<ball.r||ball.x>W-ball.r){ball.x=clamp(ball.x,ball.r,W-ball.r);ball.vx*=-.86}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.86}for(const p of pegs)if(p.alive)bounceCircle(p,1.01,()=>{p.alive=false;p.on=.3;energy++;ball.vx*=1.04;ball.vy*=1.04;sync();setMessage('공명 핀 +1 · 보드 효과가 강해집니다.')});for(const g of gates){if(g.kind==='gravity'){const dx=g.x-ball.x,dy=g.y-ball.y,l=Math.hypot(dx,dy)||1;if(l<210){ball.vx+=dx/l*180*dt;ball.vy+=dy/l*180*dt}}if(g.kind==='orbit'){const dx=ball.x-g.x,dy=ball.y-g.y,l=Math.hypot(dx,dy);if(l<62&&l>18){ball.vx+=-dy/l*240*dt;ball.vy+=dx/l*240*dt}}if(g.kind==='warp'&&!ball.cool&&Math.hypot(ball.x-g.x,ball.y-g.y)<28){const partner=gates.find(v=>v.kind==='warp'&&v!==g);if(partner){ball.x=partner.x;ball.y=partner.y+35;ball.cool=.35;energy+=2;setMessage('하루 · 워프 관문! 공명 +2')}}if(g.kind==='panel'){const dx=Math.cos(g.angle),dy=Math.sin(g.angle),t=clamp(((ball.x-g.x)*dx+(ball.y-g.y)*dy)/120,0,1),px=g.x+(t-.5)*120*dx,py=g.y+(t-.5)*120*dy,dist=Math.hypot(ball.x-px,ball.y-py);if(dist<ball.r+10){const nx=-dy,ny=dx,dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;energy++;setMessage('가온 · 반사 패널! 공명 +1')}}}}ball.cool=Math.max(0,ball.cool-dt);const wx=boss.x+Math.cos(weakA)*78,wy=boss.y+Math.sin(weakA)*78,weak=bounceCircle({x:wx,y:wy,r:20},1.02,()=>damage(true));if(!weak)bounceCircle(boss,.78,()=>damage(false));ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>20)ball.trail.shift();if(ball.y>H-72||Math.hypot(ball.vx,ball.vy)<32)settle();}
function circle(a,b,r,col,glow=0){x.save();x.fillStyle=col;x.shadowBlur=glow;x.shadowColor=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill();x.restore()}function draw(){x.fillStyle='#0b1b23';x.fillRect(0,0,W,H);for(let yy=20;yy<H;yy+=20)for(let xx=20;xx<W;xx+=20){x.fillStyle=(xx*11+yy*7)%6?'#102932':'#15363d';x.fillRect(xx,yy,18,18)}x.strokeStyle='#cfac62';x.lineWidth=3;x.strokeRect(10,10,W-20,H-20);for(const g of gates){if(g.kind==='gravity'){circle(g.x,g.y,48,'#70dce122',18);x.strokeStyle=g.col;x.lineWidth=2;x.beginPath();x.arc(g.x,g.y,38,0,Math.PI*2);x.stroke()}if(g.kind==='orbit'){x.strokeStyle=g.col;x.shadowBlur=14;x.shadowColor=g.col;x.lineWidth=3;x.beginPath();x.arc(g.x,g.y,44,0,Math.PI*2);x.stroke();x.shadowBlur=0}if(g.kind==='warp'){circle(g.x,g.y,22,'#172c25',12);x.strokeStyle=g.col;x.lineWidth=3;x.beginPath();x.arc(g.x,g.y,16,0,Math.PI*2);x.stroke()}if(g.kind==='panel'){const dx=Math.cos(g.angle),dy=Math.sin(g.angle);x.strokeStyle=g.col;x.shadowBlur=12;x.shadowColor=g.col;x.lineWidth=7;x.beginPath();x.moveTo(g.x-60*dx,g.y-60*dy);x.lineTo(g.x+60*dx,g.y+60*dy);x.stroke();x.shadowBlur=0}}for(const p of pegs)if(p.alive){circle(p.x,p.y,p.r+3,'#07151b');circle(p.x,p.y,p.r,p.on?'#f3d77b':'#5abbb2',p.on?20:7)}for(let i=1;i<ball.trail.length;i++){x.strokeStyle='#d8efe078';x.lineWidth=i/5;x.beginPath();x.moveTo(ball.trail[i-1].x,ball.trail[i-1].y);x.lineTo(ball.trail[i].x,ball.trail[i].y);x.stroke()}circle(boss.x,boss.y,boss.r+12,'#10222a',18);circle(boss.x,boss.y,boss.r,flash?'#ad5e4f':'#3c5d65',flash?28:12);x.fillStyle='#eff0df';x.font='bold 12px ui-monospace';x.textAlign='center';x.fillText('공허의 왕',boss.x,boss.y+4);const wx=boss.x+Math.cos(weakA)*78,wy=boss.y+Math.sin(weakA)*78;circle(wx,wy,22,'#ffcf66',18);circle(wx,wy,9,'#fff6ba');if(!ball.moving&&run){x.strokeStyle='#f3d97e';x.setLineDash([5,5]);x.lineWidth=2;x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(drag?.x??ball.x,drag?.y??ball.y+58);x.stroke();x.setLineDash([]);x.fillStyle='#dcebe4';x.font='bold 10px ui-monospace';x.fillText('발사대 · 좌우로 드래그',ball.x,ball.y-22)}circle(ball.x,ball.y,ball.r+4,ball.moving?'#d3f0df':'#e7bd61',ball.moving?22:12);circle(ball.x,ball.y,ball.r,'#f7fff9',8)}
c.addEventListener('pointerdown',e=>{if(!run||ball.moving)return;drag=point(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag)drag=point(e)});c.addEventListener('pointerup',e=>{if(!drag)return;const p=point(e);drag=null;launch(p)});c.addEventListener('pointercancel',()=>drag=null);document.querySelector('#battle').onclick=()=>{reset();run=true;U.overlay.classList.add('hide')};function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}buildMenu();reset();draw();requestAnimationFrame(loop);
</script></body></html>
