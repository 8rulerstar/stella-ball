<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Breakers · Rune Slingshot Prototype</title>
<style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#e8f0ea;background:#07131b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#254751,#07131b 62%)}body{display:grid;place-items:center}main{width:min(760px,100vw);padding:12px}.shell{overflow:hidden;border:1px solid #66888a;border-radius:18px;background:#0b1921;box-shadow:0 28px 80px #000b}.top{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #355961;background:#0c2029}.brand small,.stage small{display:block;color:#8db4ad;font:700 9px ui-monospace,monospace;letter-spacing:.12em}.brand b{display:block;color:#f4dfaa;font-size:17px;letter-spacing:-.04em}.stage{text-align:right}.stage b{color:#e6eee9;font-size:12px}.board{position:relative}canvas{display:block;width:100%;height:auto;touch-action:none;image-rendering:pixelated}.hud{position:absolute;inset:12px 14px auto;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px;pointer-events:none}.panel{min-width:0;padding:7px 9px;border:1px solid #52777a;background:#08161eee;box-shadow:0 2px 0 #02070a99;color:#c7dad4;font:700 10px ui-monospace,monospace}.panel.center{text-align:center}.panel b{display:block;color:#f3cf79;font-size:12px}.meter{height:6px;margin-top:4px;overflow:hidden;border:1px solid #355a5e;background:#13272d}.meter i{display:block;width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,#b9544d,#e5a05a);transition:transform .16s}.bottom{padding:10px 12px 12px;border-top:1px solid #34575d;background:#0c1d25}.message{min-height:20px;margin-bottom:8px;color:#d5e4dd;font-size:11px;text-align:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.skill{display:grid;grid-template-columns:32px 1fr;gap:6px;align-items:center;min-height:52px;padding:6px;border:1px solid #486e71;background:#102731;color:#ecf0e8;text-align:left;cursor:pointer}.skill:hover:not(:disabled){border-color:#efc66e;background:#193942}.skill:disabled{opacity:.42;cursor:default}.rune{display:grid;place-items:center;width:30px;height:30px;border:1px solid currentColor;border-radius:50%;font:bold 15px ui-monospace}.skill b{display:block;font-size:11px}.skill small{display:block;margin-top:2px;color:#b3cec6;font-size:9px;line-height:1.25}.skill.lumi{color:#74dfe2}.skill.rio{color:#ff8c91}.skill.sera{color:#d3b9ff}.overlay{position:absolute;inset:0;z-index:2;display:grid;place-content:center;padding:22px;background:linear-gradient(#07131b88,#07131be8);text-align:center}.overlay.hide{display:none}.overlay section{max-width:430px;padding:24px;border:1px solid #6b9290;background:#0a1b23f3;box-shadow:0 12px 34px #000b}.overlay small{color:#9cc7bf;font:700 10px ui-monospace,monospace;letter-spacing:.12em}.overlay h1{margin:5px 0;color:#f4dfa8;font-size:30px;letter-spacing:-.06em}.overlay p{color:#d4e1db;font-size:12px;line-height:1.7}.overlay button{margin-top:10px;border:1px solid #f0c66e;background:#8c6233;color:#fff5d5;padding:11px 20px;font-weight:800;cursor:pointer}@media(max-width:620px){main{padding:0}.shell{border-radius:0;border-width:0}.top{padding:9px}.hud{inset:8px;gap:4px}.panel{padding:5px 6px;font-size:8px}.panel b{font-size:10px}.bottom{padding:8px}.cards{gap:4px}.skill{grid-template-columns:1fr;min-height:58px;padding:5px;text-align:center}.rune{margin:auto}.skill small{display:none}.overlay section{padding:18px}.overlay h1{font-size:25px}}
</style>
</head>
<body><main><section class="shell"><header class="top"><div class="brand"><small>TACTICAL SLINGSHOT / PROTOTYPE</small><b>PRISM BREAKERS</b></div><div class="stage"><small>FRACTURE 01</small><b>균열 회랑</b></div></header><div class="board"><canvas id="game" width="720" height="900"></canvas><div class="hud"><div class="panel">발사 <b id="turn">1 / 4</b></div><div class="panel center">공허의 왕 <b id="bossHp">180</b><div class="meter"><i id="hpFill"></i></div></div><div class="panel">연쇄 <b id="combo">—</b></div></div><div id="overlay" class="overlay"><section><small>ANGRY BIRDS × PARTY TACTICS</small><h1>룬 슬링샷</h1><p>공을 <b>뒤로 당겼다가 놓아</b> 한 발을 설계하세요.<br>비행 중에는 파티 룬 <b>한 장</b>만 눌러 궤도에 개입할 수 있습니다.</p><button id="start">전술 발사 시작</button></section></div></div><footer class="bottom"><div id="message" class="message">수정·적·약점을 연결할 첫 경로를 고르세요.</div><div class="cards"><button class="skill lumi" data-skill="lumi"><span class="rune">L</span><span><b>루미 · 유도</b><small>약점으로 궤적을 휘게 합니다.</small></span></button><button class="skill rio" data-skill="rio"><span class="rune">R</span><span><b>리오 · 급회전</b><small>공을 즉시 우회전시킵니다.</small></span></button><button class="skill sera" data-skill="sera"><span class="rune">S</span><span><b>세라 · 원심줄</b><small>가까운 수정 둘레로 휘감습니다.</small></span></button></div></footer></section></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;
const U={turn:document.querySelector('#turn'),hp:document.querySelector('#bossHp'),fill:document.querySelector('#hpFill'),combo:document.querySelector('#combo'),message:document.querySelector('#message'),overlay:document.querySelector('#overlay'),cards:[...document.querySelectorAll('[data-skill]')]};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let ball,boss,crystals,enemies,drag=null,run=false,last=0,shots=0,combo=0,abilityUsed=false,weakAngle=0,flash=0;
function reset(){ball={x:136,y:740,r:13,vx:0,vy:0,moving:false,trail:[],lumi:0};boss={x:360,y:176,r:62,hp:180,maxHp:180,cool:0};crystals=[[215,448],[500,414],[360,560]].map((p,i)=>({x:p[0],y:p[1],r:27,hp:2,index:i,on:0}));enemies=[[164,294],[558,310]].map(p=>({x:p[0],y:p[1],r:23,hp:2,on:0}));shots=0;combo=0;abilityUsed=false;sync('공을 뒤로 당겼다가 놓아 첫 경로를 만드세요.');}
function sync(message){if(message)U.message.textContent=message;U.turn.textContent=(shots+1)+' / 4';U.hp.textContent=Math.max(0,Math.ceil(boss.hp));U.fill.style.transform='scaleX('+Math.max(0,boss.hp/boss.maxHp)+')';U.combo.textContent=combo?'x'+combo:'—';for(const card of U.cards)card.disabled=!ball?.moving||abilityUsed||!run;}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function settle(text){ball.moving=false;ball.vx=ball.vy=0;ball.trail=[];abilityUsed=false;combo=0;shots++;if(boss.hp<=0){win();return}if(shots>=4){sync('균열이 닫혔습니다. 다른 경로와 룬 타이밍을 시험하세요.');run=false;return}sync(text||'공이 멈췄습니다. 이 위치에서 다음 경로를 설계하세요.');}
function launch(p){const dx=ball.x-p.x,dy=ball.y-p.y,len=Math.hypot(dx,dy);if(len<18)return;const power=clamp(len/128,.35,1);ball.vx=dx/len*(540+power*620);ball.vy=dy/len*(540+power*620);ball.moving=true;abilityUsed=false;sync('비행 중 룬 카드 한 장으로 경로에 개입할 수 있습니다.');}
function hitCircle(target,rest,onHit){const dx=ball.x-target.x,dy=ball.y-target.y,dist=Math.hypot(dx,dy)||1,reach=ball.r+target.r;if(dist>=reach)return false;const nx=dx/dist,ny=dy/dist,dot=ball.vx*nx+ball.vy*ny;ball.x=target.x+nx*(reach+1);ball.y=target.y+ny*(reach+1);if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.vx*=rest;ball.vy*=rest;onHit?.()}return true;}
function damageBoss(weak){if(boss.cool>0)return;boss.cool=.22;const damage=Math.round((weak?38:14)+combo*5);boss.hp=Math.max(0,boss.hp-damage);combo++;flash=weak?1:.45;sync(weak?'약점 명중! '+damage+' 피해 · 연쇄가 이어집니다.':'보스 몸체 '+damage+' 피해');if(boss.hp<=0)settle();}
function useSkill(id){if(!run||!ball.moving||abilityUsed)return;abilityUsed=true;if(id==='lumi'){ball.lumi=1.65;sync('루미 · 약점 유도. 궤적이 잠시 휘어집니다.')}if(id==='rio'){const vx=ball.vx;ball.vx=-ball.vy;ball.vy=vx;combo++;sync('리오 · 급회전! 새 경로를 만들었습니다.')}if(id==='sera'){const target=[...crystals].filter(v=>v.hp>0).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];if(target){const dx=ball.x-target.x,dy=ball.y-target.y,l=Math.hypot(dx,dy)||1;ball.vx+=-dy/l*520;ball.vy+=dx/l*520;combo++;sync('세라 · 원심줄! 수정 둘레로 방향을 비틉니다.')}else sync('세라 · 붙잡을 수정이 없습니다.')}sync();}
function update(dt){if(!run)return;weakAngle+=dt*.74;boss.cool=Math.max(0,boss.cool-dt);flash=Math.max(0,flash-dt*2.5);for(const z of crystals)z.on=Math.max(0,z.on-dt);for(const e of enemies)e.on=Math.max(0,e.on-dt);if(!ball.moving)return;if(ball.lumi>0){ball.lumi-=dt;const wx=boss.x+Math.cos(weakAngle)*84,wy=boss.y+Math.sin(weakAngle)*84,dx=wx-ball.x,dy=wy-ball.y,l=Math.hypot(dx,dy)||1;ball.vx+=dx/l*310*dt;ball.vy+=dy/l*310*dt}ball.vy+=150*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.997,dt*60);ball.vy*=Math.pow(.997,dt*60);if(ball.x<ball.r||ball.x>W-ball.r){ball.x=clamp(ball.x,ball.r,W-ball.r);ball.vx*=-.88}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.88}if(ball.y>H-84){ball.y=H-84;settle();return}for(const z of crystals)if(z.hp>0)hitCircle(z,1.02,()=>{z.hp--;z.on=.3;combo++;ball.vx*=1.08;ball.vy*=1.08;sync('균열 수정 파괴 · 연쇄 '+combo)});for(const e of enemies)if(e.hp>0)hitCircle(e,.82,()=>{e.hp--;e.on=.25;combo++;sync('공허 잔재 명중 · 연쇄 '+combo)});const wx=boss.x+Math.cos(weakAngle)*84,wy=boss.y+Math.sin(weakAngle)*84,weak=hitCircle({x:wx,y:wy,r:21},1.03,()=>damageBoss(true));if(!weak)hitCircle(boss,.78,()=>damageBoss(false));ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>18)ball.trail.shift();if(Math.hypot(ball.vx,ball.vy)<32)settle();}
function circle(cx,cy,r,fill,glow=0){x.save();x.fillStyle=fill;x.shadowBlur=glow;x.shadowColor=fill;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();x.restore();}
function draw(){x.fillStyle='#0b1b23';x.fillRect(0,0,W,H);for(let yy=20;yy<H;yy+=24)for(let xx=20;xx<W;xx+=24){x.fillStyle=(xx*7+yy*11)%5?'#102832':'#14323a';x.fillRect(xx,yy,21,21)}x.strokeStyle='#d1aa5d';x.lineWidth=3;x.strokeRect(10,10,W-20,H-20);for(let i=1;i<ball.trail.length;i++){x.strokeStyle='#d9eee17a';x.lineWidth=i/5;x.beginPath();x.moveTo(ball.trail[i-1].x,ball.trail[i-1].y);x.lineTo(ball.trail[i].x,ball.trail[i].y);x.stroke()}for(const z of crystals){if(z.hp<=0)continue;circle(z.x,z.y,z.r+5,'#08151c');circle(z.x,z.y,z.r,z.on?'#f3dc8b':'#57b9b1',z.on?24:9);x.fillStyle='#e7cf7c';x.beginPath();x.moveTo(z.x,z.y-13);x.lineTo(z.x+11,z.y);x.lineTo(z.x,z.y+13);x.lineTo(z.x-11,z.y);x.closePath();x.fill();}for(const e of enemies){if(e.hp<=0)continue;circle(e.x,e.y,e.r+6,'#09151c');circle(e.x,e.y,e.r,e.on?'#f2c6a2':'#a65e5d',e.on?18:6);x.fillStyle='#f1d9d0';x.font='9px ui-monospace';x.textAlign='center';x.fillText('잔재',e.x,e.y+4)}circle(boss.x,boss.y,boss.r+14,'#101f27',22);circle(boss.x,boss.y,boss.r,flash?'#9d5b4f':'#385861',flash?30:18);x.fillStyle='#d8e9df';x.font='bold 12px ui-monospace';x.textAlign='center';x.fillText('공허의 왕',boss.x,boss.y+4);const wx=boss.x+Math.cos(weakAngle)*84,wy=boss.y+Math.sin(weakAngle)*84;circle(wx,wy,23,'#ffcf65',flash?28:15);circle(wx,wy,11,'#fff5be',8);if(drag&&!ball.moving){x.setLineDash([5,5]);x.strokeStyle='#f5dfaa';x.lineWidth=2;x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(drag.x,drag.y);x.stroke();x.setLineDash([]);x.fillStyle='#f3e6bf';x.font='bold 10px ui-monospace';x.textAlign='center';x.fillText('당긴 반대 방향으로 발사',ball.x,ball.y-30)}circle(ball.x,ball.y,ball.r+4,ball.moving?'#d6f1e1':'#e5ba5c',ball.moving?24:12);circle(ball.x,ball.y,ball.r,'#f5fff9',9);}
function win(){run=false;U.overlay.classList.remove('hide');U.overlay.innerHTML='<section><small>FRACTURE CLEARED</small><h1>전술 성공</h1><p>'+shots+'발 안에 공허의 왕을 무너뜨렸습니다.<br>다른 룬 카드 타이밍으로 더 짧은 경로를 찾아보세요.</p><button id="restart">다시 도전</button></section>';document.querySelector('#restart').onclick=()=>{reset();run=true;U.overlay.classList.add('hide')}}
c.addEventListener('pointerdown',e=>{if(!run||ball.moving)return;drag=point(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag)drag=point(e)});c.addEventListener('pointerup',e=>{if(!drag)return;const p=point(e);drag=null;launch(p)});c.addEventListener('pointercancel',()=>drag=null);for(const card of U.cards)card.onclick=()=>useSkill(card.dataset.skill);document.querySelector('#start').onclick=()=>{reset();run=true;U.overlay.classList.add('hide')};
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}reset();draw();requestAnimationFrame(loop);
</script></body></html>
